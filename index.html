<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI — Homework Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">✦ Study<span>AI</span></div>
    <button class="new-chat" id="newChat">＋ New Chat</button>
    <div class="side-section">QUICK TOOLS</div>
    <button class="side-btn" data-subject="Maths">∑ Maths Solver</button>
    <button class="side-btn" data-subject="Physics">⚡ Physics Helper</button>
    <button class="side-btn" data-subject="Chemistry">⚗ Chemistry Helper</button>
    <button class="side-btn" data-subject="English">A English Helper</button>
    <div class="side-section">RECENT</div>
    <div id="history" class="history"></div>
    <div class="sidebar-bottom">
      <button class="side-btn" id="themeBtn">☾ Toggle theme</button>
      <button class="side-btn" id="clearBtn">⌫ Clear chats</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu" id="menuBtn">☰</button>
      <div class="mobile-brand">✦ Study<span>AI</span></div>
      <div class="top-actions">
        <select id="classSelect" aria-label="Class">
          <option value="">Class</option>
          <option>6</option><option>7</option><option>8</option>
          <option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="logo-orb">✦</div>
        <h1>Hey, Student! 👋</h1>
        <p>Ask a homework question, upload a photo, or choose a subject.</p>

        <div class="chips">
          <button class="chip" data-prompt="Solve this Maths question step by step.">∑ Maths</button>
          <button class="chip" data-prompt="Explain this Physics question simply.">⚡ Physics</button>
          <button class="chip" data-prompt="Solve this Chemistry question and explain the concept.">⚗ Chemistry</button>
          <button class="chip" data-prompt="Help me answer this English homework question.">A English</button>
        </div>
      </div>
      <div id="messages"></div>
      <div class="typing hidden" id="typing"><span></span><span></span><span></span> StudyAI is thinking…</div>
    </section>

    <section class="composer-wrap">
      <div class="image-preview hidden" id="imagePreview">
        <img id="previewImg" alt="Selected homework">
        <button id="removeImage">×</button>
      </div>

      <div class="composer">
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button class="icon-btn" id="imageBtn" title="Upload question photo">📷</button>
        <textarea id="prompt" rows="1" placeholder="Type your homework question…"></textarea>
        <button class="send" id="sendBtn" title="Send">➤</button>
      </div>
      <div class="hint">StudyAI can make mistakes. Check important answers with your teacher or textbook.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
